appId: app.pruftnet.desktop
productName: Pruftnet
copyright: Copyright © 2026 Franklin Tenepo

directories:
    output: release
    buildResources: assets

files:
    - dist-electron/**/*
    - assets/**/*
    - '!assets/dmg/**'
    - package.json

extraResources:
    - from: ../../packages/core/drizzle
      to: drizzle

asar: true
afterPack: scripts/apply-fuses.cjs

mac:
    category: public.app-category.developer-tools
    icon: assets/icons/icon.icns
    target:
        - target: dmg
        - target: zip
    identity: null

dmg:
    artifactName: ${productName}-${version}-${os}-${arch}.${ext}
    # The window takes the size of the 1x background. Run `pnpm generate-icons` after changing
    # the layout: the background drawing is aligned on these positions.
    icon: assets/icons/icon.icns
    background: assets/dmg/background.png
    iconSize: 112
    contents:
        - { x: 180, y: 190, type: file }
        - { x: 480, y: 190, type: link, path: /Applications }

win:
    icon: assets/icons/icon.ico
    target:
        - target: nsis
    artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}

nsis:
    oneClick: false
    perMachine: false
    allowElevation: true
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: Pruftnet

linux:
    icon: assets/icons/icon.png
    category: Network
    executableName: pruftnet
    maintainer: Franklin Tenepo
    synopsis: Network analysis software
    description: Network analysis software
    target:
        - target: AppImage
        - target: deb
    artifactName: ${productName}-${version}-${os}-${arch}.${ext}

appImage:
    artifactName: ${productName}-${version}-${os}-${arch}.${ext}

deb:
    artifactName: ${productName}-${version}-${os}-${arch}.${ext}
