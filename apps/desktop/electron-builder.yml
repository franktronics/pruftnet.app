appId: app.pruftnet.desktop
productName: Pruftnet
copyright: Copyright © 2026 Franklin Tenepo

directories:
  output: release
  buildResources: assets

files:
  - dist-electron/**/*
  - assets/**/*
  - package.json

asar: true

mac:
  category: public.app-category.developer-tools
  icon: assets/icons/icon.icns
  target:
    - target: dmg
    - target: zip
  identity: null

dmg:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  icon: assets/icons/icon.ico
  target:
    - target: nsis
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pruftnet

linux:
  icon: assets/icons/icon.png
  category: Network
  executableName: pruftnet
  maintainer: Franklin Tenepo
  synopsis: Network analysis software
  description: Network analysis software
  target:
    - target: AppImage
    - target: deb
    - target: rpm
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

appImage:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

rpm:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
