name: Production Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Validate Production Tag
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require SemVer production tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must look like v0.1.2"
            exit 1
          fi

      - name: Require tag commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: Build (${{ matrix.name }})
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: macos-arm64
            runner: macos-latest
          - name: windows-x64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop installers
        run: pnpm build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pruftnet-production-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            !apps/desktop/release/*-unpacked/**
            !apps/desktop/release/mac*/**
            !apps/desktop/release/win*/**
            !apps/desktop/release/builder-debug.yml
          if-no-files-found: error

  release:
    name: Publish Production Release
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*
