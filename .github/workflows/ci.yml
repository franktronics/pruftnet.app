name: CI
# Dev pushes are built by release.yml, which validates every dev commit with the nightly identity.
on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true
jobs:
    validate:
        uses: ./.github/workflows/build.yml
        with:
            ref: ${{ github.sha }}
