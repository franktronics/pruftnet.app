name: Release
# Nightlies run on the dev push created by a PR merge, not on the pull_request event: the
# github-pages environment only accepts dev, main and v0.* refs, and a pull_request run deploys
# from the PR branch. prepare-release.mjs skips dev pushes that are not PR merges.
on:
    push:
        branches: [dev]
        tags: ['v0.*']
permissions:
    contents: read
concurrency:
    group: release-${{ github.ref == 'refs/heads/dev' && 'nightly' || 'main' }}
    cancel-in-progress: false
jobs:
    prepare:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            pull-requests: read
        outputs:
            version: ${{ steps.release.outputs.version }}
            channel: ${{ steps.release.outputs.channel }}
            ref: ${{ steps.release.outputs.ref }}
            publish: ${{ steps.release.outputs.publish }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: .node-version
            - id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/distribution/prepare-release.mjs
    build:
        needs: prepare
        if: needs.prepare.outputs.publish == 'true'
        uses: ./.github/workflows/build.yml
        with:
            ref: ${{ needs.prepare.outputs.ref }}
            version: ${{ needs.prepare.outputs.version }}
            channel: ${{ needs.prepare.outputs.channel }}
    publish:
        needs: [prepare, build]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.publish.outputs.tag }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ needs.prepare.outputs.ref }}
                  persist-credentials: false
            - uses: actions/download-artifact@v8.0.1
              with:
                  pattern: packages-*
                  path: release
                  merge-multiple: true
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: .node-version
            - id: publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRUFTNET_VERSION: ${{ needs.prepare.outputs.version }}
                  PRUFTNET_CHANNEL: ${{ needs.prepare.outputs.channel }}
                  RELEASE_COMMIT: ${{ needs.prepare.outputs.ref }}
              run: node scripts/distribution/publish.mjs
    repositories:
        needs: [prepare, publish]
        uses: ./.github/workflows/repositories.yml
        permissions:
            contents: read
            pages: write
            id-token: write
        secrets: inherit
