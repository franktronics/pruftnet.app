name: Release
on:
    push:
        tags: ['v0.*']
    pull_request:
        types: [closed]
        branches: [dev]
permissions:
    contents: read
concurrency:
    group: release-${{ github.event_name == 'pull_request' && 'nightly' || 'main' }}
    cancel-in-progress: false
jobs:
    prepare:
        if: github.event_name == 'push' || github.event.pull_request.merged == true
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.release.outputs.version }}
            channel: ${{ steps.release.outputs.channel }}
            ref: ${{ steps.release.outputs.ref }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: .node-version
            - id: release
              run: node scripts/distribution/prepare-release.mjs
    build:
        needs: prepare
        uses: ./.github/workflows/build.yml
        with:
            ref: ${{ needs.prepare.outputs.ref }}
            version: ${{ needs.prepare.outputs.version }}
            channel: ${{ needs.prepare.outputs.channel }}
    publish:
        needs: [prepare, build]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        outputs:
            tag: ${{ steps.publish.outputs.tag }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ needs.prepare.outputs.ref }}
                  persist-credentials: false
            - uses: actions/download-artifact@v8.0.1
              with:
                  pattern: packages-*
                  path: release
                  merge-multiple: true
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: .node-version
            - id: publish
              env:
                  GH_TOKEN: ${{ github.token }}
                  PRUFTNET_VERSION: ${{ needs.prepare.outputs.version }}
                  PRUFTNET_CHANNEL: ${{ needs.prepare.outputs.channel }}
                  RELEASE_COMMIT: ${{ needs.prepare.outputs.ref }}
              run: node scripts/distribution/publish.mjs
    repositories:
        needs: [prepare, publish]
        uses: ./.github/workflows/repositories.yml
        permissions:
            contents: read
            pages: write
            id-token: write
        secrets: inherit
